<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Fourth Web Page</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <!-- Container to wrap everything -->
    <div id="container">

        <!-- Brand of website -->
        <header>My Web Site Brand</header>

        <!-- Main navigation -->
        <nav>
            <ul>
                <li><a href="/index.html">Home</a></li>
                <li><a href="/page2.html">About</a></li>
                <li><a href="/page4.html">Gallery</a></li>
                <li><a href="/page3.html">Contact</a></li>
            </ul>
        </nav>

        <!-- Main content area -->
        <main>
            <h1>My Fourth Heading</h1>
            <p>My Fourth Paragraph</p>

            <ul id="album">
                <!-- Images generated by JavaScript -->
            </ul>

        </main>

        <!-- Footer information -->
        <footer>&copy; Copyright 2022 My Website Name</footer>

    </div>
    <!-- End Container -->

    <!-- Information Box Modal (Hidden by default) -->
    <div id="infoModal" class="modal">
        <div class="modal-content">
            <h2 id="modalTitle">Title</h2>
            <p id="modalDesc">Description text goes here...</p>
            <a href="#" id="closeModal" onclick="closeModal(); return false;">Click This To Close</a>
        </div>
    </div>

    <script>
        // Data for images, captions and descriptions
        var photoData = [
            {
                file: "winterland1",
                caption: "Snow Land",
                description: "Most of plants and animals are having their hibernation period, so winter is not full of bright colors, but who says that white, snowy and a bit magical winter is not cool?",
                hoverText: "After an overnight snowstorm"
            },
            {
                file: "winterland2", 
                caption: "Winter in the Country",
                description: "Experience the serene beauty of rural winter landscapes where snow blankets the fields and creates a peaceful atmosphere away from the city noise.",
                hoverText: "Snowy countryside morning"
            },
            {
                file: "winterland3",
                caption: "Wintery Road", 
                description: "The most beautiful phenomenon of the winter is snow! You know that the snowflakes are never repeat themselves, they have amazing shapes, that different with each new snowflake.",
                hoverText: "Snowy drive in the area"
            },
            {
                file: "winterland4",
                caption: "Frozen Lake",
                description: "Winter transforms lakes into natural ice rinks. The frozen surface reflects the pale winter light, creating magical scenes perfect for photography.",
                hoverText: "Ice forming on the lake"
            },
            {
                file: "winterland5",
                caption: "Snowy Forest",
                description: "Walk through winter forests where bare branches create intricate patterns against the sky, and the silence is broken only by the crunch of snow beneath your feet.",
                hoverText: "Deep woods in winter"
            },
            {
                file: "winterland6",
                caption: "Winter Sunset",
                description: "Winter sunsets paint the sky in brilliant hues of orange and purple, reflecting off the snow to create double the beauty of any other season.",
                hoverText: "End of a winter day"
            }
        ];

        var imageList = []; 
        var openList = "<li id='photo'>"; 
        var closeList = "</li>"; 

        // Create a loop to create 6 images
        for (var i = 0; i < photoData.length; i++) {
            // Create the image structure with hover text overlay
            var imageContainer = 
                "<div class='image-wrapper' onclick='openModal(" + i + ")'>" +
                    "<img src='images/" + photoData[i].file + ".jpg' alt='" + photoData[i].caption + "'>" +
                    "<div class='hover-box'>" +
                        "<p>" + photoData[i].hoverText + "</p>" +
                        "<span class='click-icon'>👆</span>" +
                    "</div>" +
                "</div>";
            
            // Assemble list item
            var listItem = openList + imageContainer + closeList;
            imageList.push(listItem);
        }

        // Display all six image codes stored in the array
        document.getElementById("album").innerHTML = imageList.join("");

        // Function to open modal with specific content
        function openModal(index) {
            document.getElementById("modalTitle").innerText = photoData[index].caption;
            document.getElementById("modalDesc").innerText = photoData[index].description;
            document.getElementById("infoModal").style.display = "flex";
        }

        // Function to close modal
        function closeModal() {
            document.getElementById("infoModal").style.display = "none";
        }

        // Close modal when clicking outside the content
        window.onclick = function(event) {
            var modal = document.getElementById("infoModal");
            if (event.target == modal) {
                closeModal();
            }
        }
    </script>

</body>

</html>
